# Production release, in the order the plan requires:
#   CI -> database migrations -> Edge Functions -> frontend (Cloudflare Pages) -> smoke tests
# Migrations are backward-compatible, so they are applied BEFORE the code that depends on them.
# Runs for pushes to main (i.e. merges). A manual run is allowed only on main or on a tag, which is how you
# roll back: dispatch an older tag.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deployments at once, and never cancel one half-way through.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    # Only merged code reaches production: main, or a tag when rolling back. A manual run on an
    # unmerged feature branch is refused here (and should also be blocked by the environment's
    # "deployment branches" rule, see docs/DEPLOYMENT.md).
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Configure required reviewers on this environment to gate every production release.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Link Supabase project
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Preview pending migrations
        run: npx supabase db push --remote --dry-run

      - name: Apply database migrations
        run: npx supabase db push --remote --yes

      - name: Deploy Edge Functions
        # verify_jwt per function comes from supabase/config.toml (guarded by a test).
        run: npx supabase functions deploy --use-api --yes

      - name: Build frontend
        env:
          # Publishable values only. A service-role/secret key must never reach the browser bundle.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=main

      - name: Smoke tests against production
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: node scripts/smoke-test.ts
