# Pull-request previews on Cloudflare Pages.
# Safety rules: previews use PUBLISHABLE keys only and should point at a separate Supabase project that
# holds no production data. Forks never get secrets, so their PRs are simply not previewed.
name: Preview

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # The branch name is attacker-controlled text: sanitise it before it goes anywhere near a command.
      - name: Compute a safe preview branch name
        id: branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          safe="$(printf '%s' "$HEAD_REF" | tr -c 'A-Za-z0-9' '-' | cut -c1-40)"
          echo "name=pr-${safe:-preview}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Deploy preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=${{ steps.branch.outputs.name }}

      - name: Show preview URL
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "Preview: $URL" >> "$GITHUB_STEP_SUMMARY"
